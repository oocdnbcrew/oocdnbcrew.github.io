<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex">

<meta property="og:image" content="https://oocdnbcrew.github.io/icon.jpg">

<link rel="apple-touch-icon" href="/icon.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>

<body>
<!-- Out of Control: Rahmen um die Google-Web-App (ohne Google-Hinweisbalken). Inhalt + Daten kommen weiter von Google. -->
<iframe id="app" title="Theke 1" allow="clipboard-read; clipboard-write; camera; microphone; fullscreen" allowfullscreen></iframe>
<script>
  var fest = 'theke=Theke%201';
  var q = location.search.replace(/^\?/, '').replace(/(^|&)h=1(?=&|$)/g, '').replace(/^&/, '');
  var alle = [fest, q, 'h=1'].filter(function (x) { return x; }).join('&');
  document.getElementById('app').src = 'https://script.google.com/macros/s/AKfycbwK4-FEERWvd1Cl60Jf-xxvhFnpdp99utJSITKwSqn7WCsE-QO1Qe26vRXTneKgNMM_/exec?' + alle + location.hash;
  // 18.11.2026: Runterziehen in der App -> Nachricht -> ganze Seite neu laden (wie Chrome-Aktualisieren)
  window.addEventListener('message', function (e) {
    var o = String(e.origin || '');
    if (o.slice(-22) !== '.googleusercontent.com' && o !== 'https://script.google.com') return;
    if (e.data && e.data.ooc === 'neuladen') location.reload();
    // 19.11.2026: App bittet nach einem Tipp um Vollbild (Adressleiste weg) – z. B. Eingang an der Kasse
    if (e.data && e.data.ooc === 'vollbild' && !document.fullscreenElement) {
      var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
      if (f) try { var p = f.call(d, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (er) {}
    }
  });
  // Bildschirm anlassen (Screen Wake Lock): beim Laden, nach jedem Zurückkommen auf die Seite und alle 15 s neu versuchen
  var WL = null;
  function wachHalten() {
    try { if ('wakeLock' in navigator && !WL && document.visibilityState === 'visible')
      navigator.wakeLock.request('screen').then(function (l) { WL = l; l.addEventListener('release', function () { WL = null; }); }).catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wachHalten(); });
  window.addEventListener('focus', wachHalten); window.addEventListener('pointerdown', wachHalten, true);
  wachHalten(); setInterval(wachHalten, 15000);
  // 20.11.2026 (Mike): Vollbild automatisch. Browser erlauben Vollbild nur nach einem Tipp – und Firefox zählt Tipps im
  // Google-Rahmen nicht. Darum fängt eine unsichtbare Schicht in DIESER Seite den ersten Tipp ab, schaltet Vollbild an
  // und verschwindet. Verlässt jemand das Vollbild (Esc), macht der nächste Tipp es wieder an. iPhone kann kein Vollbild → keine Schicht.
  (function () {
    var d = document, el = d.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) return;
    // 20.11. abends (Mike): am Handy hat die Schicht das Wischen/Scrollen geschluckt → nur an Geräten OHNE Touch (PC mit Maus).
    // Am Handy schaltet die App selbst beim ersten Tipp ins Vollbild (Chrome Android lässt das aus dem Google-Rahmen zu).
    if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) return;
    var s = d.createElement('div');
    s.style.cssText = 'position:fixed;inset:0;z-index:9;background:transparent;cursor:pointer';
    function ist() { return d.fullscreenElement || d.webkitFullscreenElement; }
    function an() {
      if (s.parentNode) s.parentNode.removeChild(s);
      if (ist()) return;
      try { var p = f.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    function zeig() { if (!ist() && !s.parentNode) d.body.appendChild(s); }
    s.addEventListener('click', an); s.addEventListener('pointerup', an); s.addEventListener('wheel', an);
    d.addEventListener('keydown', function () { if (s.parentNode) an(); });
    d.addEventListener('fullscreenchange', function () { if (!ist()) setTimeout(zeig, 1500); });
    d.addEventListener('webkitfullscreenchange', function () { if (!ist()) setTimeout(zeig, 1500); });
    zeig();
  })();

</script>
</body>
</html>
